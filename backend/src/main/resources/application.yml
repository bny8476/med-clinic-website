server:
  port: ${PORT:8080}
  address: 0.0.0.0
  forward-headers-strategy: NATIVE

spring:
  main:
    allow-bean-definition-overriding: true
    lazy-initialization: true
  application:
    name: clinic-app
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: none
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  access-token-expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 minutes

cors:
  # In production (Render), override via the ALLOWED_ORIGINS environment variable.
  # Set it to your Render frontend URL, e.g.: https://your-app.onrender.com
  # For multiple origins: https://your-app.onrender.com,http://localhost:5173
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:5174}

management:
  endpoints:
    web:
      exposure:
        include: health, info

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:mock}
  auth-token: ${TWILIO_AUTH_TOKEN:mock}
  from-number: ${TWILIO_FROM_NUMBER:mock}
  api-key-sid: ${TWILIO_API_KEY_SID:mock}
  api-key-secret: ${TWILIO_API_KEY_SECRET:mock}
  video:
    enabled: ${TWILIO_VIDEO_ENABLED:false}

app:
  flyway:
    baseline-on-migrate: false
    baseline-version-clinic: "0"

  datasource:
    clinic:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/clinic}
      username: ${DB_USER:postgres}
      password: ${DB_PASSWORD:postgres}

  frontend-url: ${FRONTEND_URL:http://localhost:3000}

# PACS / DICOM (Orthanc) Configuration
orthanc:
  url: ${ORTHANC_URL:http://localhost:8042}
  username: ${ORTHANC_USERNAME:orthanc}
  password: ${ORTHANC_PASSWORD:orthanc}

# Gemini AI Configuration
gemini:
  api:
    key: ${GEMINI_API_KEY:mock_gemini_key}
    url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_placeholder}

pharmacy:
  service:
    url: ${PHARMACY_SERVICE_URL:https://pms-pharmadesk.onrender.com}
    api-key: ${PHARMACY_API_KEY:pharma_api_key_sample_12345}
    webhook-secret: ${PHARMACY_WEBHOOK_SECRET:pharma_webhook_secret_67890}
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
