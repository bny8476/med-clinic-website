server:
  port: ${PORT:8080}
  address: 0.0.0.0
  forward-headers-strategy: NATIVE

spring:
  main:
    allow-bean-definition-overriding: true
    lazy-initialization: false
  application:
    name: clinic-main-service
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_EXPIRATION_MS:900000}

cors:
  allowed-origins: ${ALLOWED_ORIGINS:https://med-clinic-website.onrender.com,https://med-clinic-website.vercel.app,http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health, info

app:
  growth-service:
    url: ${GROWTH_SERVICE_URL:http://localhost:8081}
  gateway:
    secret: ${INTERNAL_GATEWAY_SECRET}
  flyway:
    baseline-on-migrate: true
    baseline-version-clinic: "0"

  datasource:
    clinic:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/clinic}
      username: ${DB_USER:postgres}
      password: ${DB_PASSWORD:postgres}

  frontend-url: ${FRONTEND_URL:http://localhost:3000}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_placeholder}
