spring:
  main:
    lazy-initialization: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

cors:
  allowed-origins: ${ALLOWED_ORIGINS:https://med-clinic-website.vercel.app,https://med-clinic-website.onrender.com,https://subclinic-website.onrender.com,http://localhost:5173,http://localhost:3000}

app:
  growth-service:
    url: ${GROWTH_SERVICE_URL:https://subclinic-website.onrender.com}
  gateway:
    secret: ${INTERNAL_GATEWAY_SECRET:clinic-internal-secret-key-2026}
  flyway:
    baseline-on-migrate: true
    baseline-version-clinic: "114"

  datasource:
    clinic:
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      minimum-idle: 1
      maximum-pool-size: 5

server:
  port: ${PORT:8080}
  address: 0.0.0.0
  forward-headers-strategy: NATIVE
  tomcat:
    threads:
      max: 25
      min-spare: 5
    max-connections: 150
